            hint: "⚠️ CGV — modifier avec précaution."

      # ═════════════════════════════════════════════════════════════
      # POLITIQUE COOKIES (Markdown body + table structurée)
      # ═════════════════════════════════════════════════════════════
      - name: politique-cookies
        label: "Politique de cookies"
        file: src/content/static-pages/politique-cookies.md
        media_folder: /public/images
        public_folder: /images
        preview_path: "politique-cookies"
        fields:
          - name: meta
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre (balise <title>)", widget: string }
              - { name: description, label: "Meta description Google", widget: text }
          - name: pageHeader
            label: "Header"
            widget: object
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: subtitle, label: "Sous-titre", widget: text, required: false }
          - name: body
            label: "Corps de la politique (Markdown)"
            widget: markdown
            hint: "⚠️ Politique cookies — modifier avec précaution."
          - name: cookiesTable
            label: "Liste des cookies (rendue en tableau)"
            widget: object
            collapsed: true
            fields:
              - name: functionalCookies
                label: "Cookies fonctionnels (auto — pas de consentement requis)"
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Nom du cookie", widget: string }
                  - { name: purpose, label: "Finalité", widget: text }
                  - { name: type, label: "Type", widget: string, default: "Fonctionnel — strictement nécessaire" }
                  - { name: duration, label: "Durée de conservation", widget: string }
                  - { name: consent, label: "Consentement requis ?", widget: boolean, default: false }
              - name: analyticsCookies
                label: "Cookies statistiques (Google Analytics — consentement requis)"
                widget: list
                collapsed: true
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Nom du cookie", widget: string }
                  - { name: purpose, label: "Finalité", widget: text }
                  - { name: type, label: "Type", widget: string, default: "Statistiques — consentement requis" }
                  - { name: duration, label: "Durée de conservation", widget: string }
                  - { name: consent, label: "Consentement requis ?", widget: boolean, default: true }

  # ─── ARTICLES DE BLOG EN ──────────────────────────────────────────────
  - name: blog-en
    label: "Articles — EN"
    label_singular: "EN post"
    folder: src/content/blog-en
    media_folder: /public/images/blog
    public_folder: /images/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    preview_path: "en/journal/{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    thumbnail: cover
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: description, label: "Description (SEO meta, 120-160 chars)", widget: text, pattern: ['^.{50,200}$', '50 to 200 characters'] }
      - { name: date, label: "Publication date", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: updated, label: "Last updated (if revised later)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false }
      - name: author
        label: "Author"
        widget: select
        default: "La Brasserie des Plantes"
        options:
          - { label: "Étienne", value: "Étienne" }
          - { label: "Guillaume", value: "Guillaume" }
          - { label: "La Brasserie des Plantes (brand)", value: "La Brasserie des Plantes" }
      - { name: cover, label: "Cover image (16:9)", widget: image, required: false, choose_url: true }
      - { name: coverAlt, label: "Image alt text (accessibility + image SEO — leave empty to fallback on title)", widget: string, required: false }
      - name: category
        label: "Category"
        widget: select
        options: [Plants, Recipes, Terroir, Craft, News]
      - { name: readingTime, label: "Reading time (e.g. \"5 min\")", widget: string, default: "5 min" }
      - { name: body, label: "Article content", widget: markdown }
