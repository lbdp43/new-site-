# Sveltia CMS — configuration
# Doc : https://github.com/sveltia/sveltia-cms
#
# Les collections ici miroitent le schema Zod défini dans
# `src/content.config.ts`. À chaque changement de ce schema (nouveau champ,
# nouvelle catégorie), mettre à jour ce fichier en miroir.

backend:
  name: github
  repo: lbdp43/new-site-
  branch: main
  # ⚠️ Par défaut, Sveltia CMS utilise api.netlify.com/auth (compat Netlify CMS)
  # qui renvoie 404 si on n'est pas hébergé Netlify.
  # On bascule sur le proxy OAuth hébergé gratuitement par Sveltia :
  base_url: https://auth.sveltia.app
  auth_endpoint: /oauth/authorize
  # Fallback : si ce proxy est indisponible, l'utilisateur clique
  # "Sign In Using Access Token" et colle un GitHub PAT. Voir
  # docs/cms-admin.md section "Première connexion".

# Media folder global → le CMS peut LIRE n'importe quelle image de public/images/*
# (gallery, stories, products, team, brand…). Les UPLOADS d'articles de blog
# atterrissent dans public/images/blog/ via l'override par collection ci-dessous.
media_folder: public/images
public_folder: /images

# Branche de publication editoriale : chaque édition crée un commit sur main
# directement. On peut passer en mode "editorial_workflow" plus tard si on
# veut un système brouillon → review → merge.
publish_mode: simple

locale: fr

collections:
  # ─── ARTICLES DE BLOG FR ──────────────────────────────────────────────
  - name: blog-fr
    label: "Articles — FR"
    label_singular: "Article FR"
    folder: src/content/blog
    # Uploads de nouvelles images de cet CMS → vont dans public/images/blog/
    media_folder: /public/images/blog
    public_folder: /images/blog
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    preview_path: "blog/{{slug}}"
    summary: "{{title}} — {{date | date('DD/MM/YYYY')}}"
    thumbnail: cover
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Titre", widget: string }
      - { name: description, label: "Description (meta SEO, 120-160 car.)", widget: text, pattern: ['^.{50,200}$', '50 à 200 caractères'] }
      - { name: date, label: "Date de publication", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { name: updated, label: "Dernière mise à jour (si ajout ultérieur)", widget: datetime, format: "YYYY-MM-DD", time_format: false, picker_utc: false, required: false }
      - name: author
        label: "Auteur"
        widget: select
        default: "La Brasserie des Plantes"
        options:
          - { label: "Étienne", value: "Étienne" }
          - { label: "Guillaume", value: "Guillaume" }
          - { label: "La Brasserie des Plantes (compte collectif)", value: "La Brasserie des Plantes" }
      - { name: cover, label: "Image de couverture (16:9 recommandé)", widget: image, required: false, choose_url: true }
      - { name: coverAlt, label: "Texte alternatif de l'image (accessibilité + SEO image — laisser vide = utilise le titre)", widget: string, required: false }
      - name: category
        label: "Catégorie"
        widget: select
        options: [Plantes, Recettes, Terroir, Fabrication, Actualité]
      - { name: readingTime, label: "Temps de lecture (ex: \"5 min\")", widget: string, default: "5 min" }
      - { name: body, label: "Contenu de l'article", widget: markdown }

  # ─── PRODUITS (fiches boutique) ───────────────────────────────────────
  # Phase 2 CMS — chaque produit = un .md dans src/content/products/
  # Les nouveaux produits créés côté WooCommerce apparaissent ici en draft:true
  # (script sync-wc-stock.mjs). Il suffit de remplir les champs manquants et
  # de passer draft → false pour publier la fiche sur le site.
  - name: products
    label: "Produits"
    label_singular: "Produit"
    folder: src/content/products
    media_folder: /public/images/products
    public_folder: /images/products
    create: true
    delete: false  # sécurité : suppression d'un produit = action sensible, la faire en code
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    preview_path: "boutique/{{slug}}"
    thumbnail: image
    summary: "{{name}} — {{range}}"
    sortable_fields: [name, range, order, priceMin]
    fields:
      - { name: name, label: "Nom commercial", widget: string, hint: "Ex: L'Alchimie Végétale. Apparaît en titre de fiche + schema Product." }
      - name: range
        label: "Gamme"
        widget: select
        options:
          - { label: "Brasserie (signature)", value: brasserie }
          - { label: "Apéritifs", value: aperitif }
          - { label: "Lumière Obscure (CBD)", value: lumiere-obscure }
          - { label: "Édition limitée / cuvée", value: edition-limitee }
          - { label: "Coffret / accessoire", value: accessoire }
      - name: draft
        label: "Brouillon — caché du site"
        widget: boolean
        default: false
        hint: "true = fiche pas encore finie, cachée du site. false = publiée."
      - { name: order, label: "Ordre d'affichage dans la gamme", widget: number, required: false, hint: "Plus petit = affiché en premier" }
      - { name: priceMin, label: "Prix minimum (€)", widget: number, value_type: float, step: 0.5 }
      - { name: priceMax, label: "Prix maximum (€)", widget: number, value_type: float, step: 0.5, hint: "Identique à priceMin si un seul format" }
      - { name: alcohol, label: "Taux d'alcool (% vol.)", widget: number, value_type: float, step: 0.5 }
      - { name: wcId, label: "ID WooCommerce", widget: number, required: false, hint: "ID numérique du produit côté WP. Requis pour le panier." }
      - { name: wcSizeAttribute, label: "Attribut variation WC", widget: string, required: false, default: "Contenance", hint: "Nom de l'attribut WooCommerce pour la contenance (défaut: Contenance)" }
      - { name: defaultSize, label: "Contenance par défaut (cl)", widget: number, required: false, hint: "Ex: 20, 70 — utilisé par le Coffret DIY" }
      - { name: image, label: "Photo principale (bouteille sur fond transparent)", widget: image }
      - { name: image2, label: "Photo secondaire (hover, mise en ambiance)", widget: image, required: false }
      - name: sizes
        label: "Contenances disponibles"
        widget: list
        required: false
        hint: "Ex: Empilable 20cl, 50cl, 70cl, Magnum 150cl"
        field: { name: size, label: Contenance, widget: string }
      - name: sizeImages
        label: "Photos par contenance"
        widget: list
        required: false
        collapsed: true
        summary: "{{fields.size}} cl"
        hint: "Une photo par contenance. Ajoute autant de formats que tu veux (20, 50, 70, 150…)."
        fields:
          - { name: size, label: "Contenance (cl)", widget: number, value_type: int, hint: "Ex: 20, 50, 70, 150" }
          - { name: image, label: "Photo", widget: image }
      - name: composition
        label: "Composition (plantes, ingrédients)"
        widget: list
        required: false
        field: { name: ingredient, label: Ingrédient, widget: string }
      - { name: usage, label: "Usage / occasion", widget: string, hint: "Ex: Digestif de prestige, Apéritif amer, Accessoire" }
      - { name: tagline, label: "Accroche (affichée sur la carte)", widget: string, required: false }
      - { name: highlight, label: "Badge (ex: Meilleur Digestif du Monde 2025)", widget: string, required: false }
      - name: awards
        label: "Distinctions / médailles"
        widget: list
        required: false
        field: { name: award, label: Distinction, widget: string }
      - name: tasting
        label: "Profil sensoriel"
        widget: object
        required: false
        collapsed: true
        fields:
          - { name: nose, label: "Nez", widget: string, required: false }
          - { name: palate, label: "Bouche", widget: string, required: false }
          - { name: finish, label: "Finale", widget: string, required: false }
      - { name: serving, label: "Conseil de service", widget: text, required: false }
      - name: body
        label: "Description longue (fiche produit)"
        widget: markdown
        required: false
        hint: "Texte principal sur la page /boutique/<slug>. Storytelling, histoire, détails."

  # ─── PAGES STATIQUES (contenu éditorial des pages du site) ───────────
  # `files:` collection : chaque page a son propre schema de champs, adapté
  # à sa structure. Guillaume/Étienne éditent textes ET images sans toucher
  # aux fichiers .astro. Les gabarits sont créés par le dev.
  #
  # NB : YAML "anchors" (&meta-fields, *meta-fields) pour ne pas dupliquer
  # les champs partagés entre pages (SEO, ctaSection, pageHeader).
  - name: static-pages
    label: "Pages du site"
    label_singular: "Page"
    delete: false
    editor: { preview: false }
    files:

      # ═════════════════════════════════════════════════════════════
      # PAGE D'ACCUEIL (home)
      # ═════════════════════════════════════════════════════════════
      - name: index
        label: "Page d'accueil"
        file: src/content/static-pages/index.md
        media_folder: /public/images
        public_folder: /images
        preview_path: ""
        fields:
          - name: meta
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre (balise <title>)", widget: string }
              - { name: description, label: "Meta description Google", widget: text }
          - name: heroHome
            label: "Hero (vidéo plein écran)"
            widget: object
            fields:
              - { name: badge, label: "Badge (haut du hero)", widget: string, required: false }
              - { name: logo, label: "Logo emblème (image PNG/WebP transparente)", widget: image, required: false }
              - { name: logoAlt, label: "Alt du logo", widget: string, required: false }
              - { name: titleScript, label: "Titre calligraphié (Nom de la marque)", widget: string }
              - { name: titleAccent, label: "Sous-titre (HTML autorisé : <br />)", widget: string, required: false }
              - { name: intro, label: "Paragraphe d'intro (**gras** autorisé)", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton 1 — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton 1 — lien", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton 2 — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton 2 — lien", widget: string, required: false }
              - { name: video, label: "Vidéo de fond (mp4)", widget: file, required: false }
              - { name: videoPoster, label: "Image poster vidéo (preload)", widget: image, required: false }
          - name: carouselSection
            label: "Section « Carousel produits »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: heading, label: "Titre", widget: string }
              - { name: subtitle, label: "Sous-titre", widget: text, required: false }
          - name: historySection
            label: "Section « Notre savoir-faire »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: divider, label: "Divider doré", widget: string, required: false }
              - { name: title, label: "Titre (HTML autorisé)", widget: string }
              - name: paragraphs
                label: "Paragraphes (Markdown gras/italique)"
                widget: list
                field: { name: paragraph, label: "Paragraphe", widget: text }
              - name: links
                label: "Liens de bas de section"
                widget: list
                fields:
                  - { name: label, label: "Texte du lien", widget: string }
                  - { name: href, label: "URL", widget: string }
          - name: introVideoSection
            label: "Bandeau vidéo « Chaque flacon »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: video, label: "Vidéo (mp4)", widget: file }
              - { name: poster, label: "Poster", widget: image, required: false }
              - { name: script, label: "Script calligraphié en haut", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: titleAccent, label: "Titre 2ᵉ ligne (calligraphie)", widget: string, required: false }
              - { name: tagline, label: "Tagline (sous le titre)", widget: text, required: false }
          - name: coffretTeaser
            label: "Teaser « Coffret DIY »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: titleAccent, label: "Titre 2ᵉ ligne (calligraphie)", widget: string, required: false }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton 1 — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton 1 — lien", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton 2 — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton 2 — lien", widget: string, required: false }
              - name: stackImages
                label: "3 bouteilles empilées (top → bas)"
                widget: list
                summary: "{{fields.alt}}"
                fields:
                  - { name: src, label: "Image (fond transparent — 20cl stack)", widget: image }
                  - { name: alt, label: "Alt image", widget: string }
          - name: cocktailsSection
            label: "Section « Cocktails »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre (HTML autorisé)", widget: string }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
              - { name: ctaLabel, label: "Bouton — texte", widget: string, required: false }
              - { name: ctaHref, label: "Bouton — lien", widget: string, required: false }
              - name: cocktails
                label: "4 cocktails (grille 2×2)"
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Nom du cocktail", widget: string }
                  - { name: image, label: "Photo cocktail", widget: image }
                  - { name: href, label: "URL (#ancre cocktails/…)", widget: string }
                  - { name: offset, label: "Décalage vertical (2ᵉ et 4ᵉ)", widget: boolean, default: false }
          - name: visitSection
            label: "Section « Visite boutique »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: titleAccent, label: "Titre 2ᵉ ligne (calligraphie)", widget: string, required: false }
              - { name: intro, label: "Paragraphe (**gras** — placeholders {{address}} / {{city}})", widget: text, required: false }
              - { name: addressLabel, label: "Label Adresse", widget: string, required: false }
              - { name: hoursLabel, label: "Label Horaires", widget: string, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton 1 — texte (auto vers Maps)", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton 2 — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton 2 — lien", widget: string, required: false }
              - { name: video, label: "Vidéo boutique (mp4)", widget: file, required: false }
              - { name: videoPoster, label: "Poster vidéo", widget: image, required: false }
              - { name: videoAlt, label: "Alt vidéo", widget: string, required: false }
          - name: ctaSection
            label: "Section CTA final"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: script, label: "Script calligraphié en haut", widget: string, required: false }
              - { name: title, label: "Titre (HTML autorisé)", widget: string }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton — lien", widget: string, required: false }
          - name: featuredSection
            label: "Section « Six flacons à découvrir »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: seeAllLabel, label: "Lien « Voir tous » — texte", widget: string, required: false }
              - { name: seeAllHref, label: "Lien « Voir tous » — URL", widget: string, required: false }

      # ═════════════════════════════════════════════════════════════
      # ATELIERS
      # ═════════════════════════════════════════════════════════════
      - name: ateliers
        label: "Ateliers"
        file: src/content/static-pages/ateliers.md
        media_folder: /public/images
        public_folder: /images
        preview_path: "ateliers"
        fields:
          - name: meta
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre (balise <title>)", widget: string }
              - { name: description, label: "Meta description Google", widget: text }
          - name: hero
            label: "Hero (haut de page, vidéo)"
            widget: object
            fields:
              - { name: kicker, label: "Petit texte au-dessus du titre", widget: string, required: false }
              - { name: title, label: "Titre principal", widget: string }
              - { name: titleAccent, label: "Titre — 2ᵉ ligne stylée (calligraphie)", widget: string, required: false }
              - { name: intro, label: "Paragraphe d'intro", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton principal — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton principal — lien", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton secondaire — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton secondaire — lien", widget: string, required: false }
              - { name: video, label: "Vidéo de fond (mp4)", widget: file, required: false }
              - { name: videoPoster, label: "Image poster vidéo", widget: image, required: false }
              - { name: videoAlt, label: "Description alt vidéo", widget: string, required: false }
          - name: workshopsSection
            label: "Section « Deux formats »"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: "Petit texte au-dessus", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
          - name: workshops
            label: "Ateliers (liste)"
            widget: list
            collapsed: true
            summary: "{{fields.title}} — {{fields.price}} €"
            fields:
              - { name: id, label: "ID (ancre URL, sans espaces)", widget: string }
              - { name: kicker, label: "Étiquette (haut de vignette)", widget: string }
              - { name: title, label: "Titre atelier", widget: string }
              - { name: subtitle, label: "Sous-titre", widget: text }
              - { name: price, label: "Prix (€)", widget: number, value_type: int }
              - { name: duration, label: "Durée (texte)", widget: string }
              - { name: participants, label: "Nombre de participants", widget: string }
              - { name: ageMin, label: "Âge minimum", widget: number, value_type: int }
              - { name: language, label: "Langue", widget: string, default: "Français" }
              - name: includes
                label: "Ce qui est inclus"
                widget: list
                field: { name: item, label: "Ligne", widget: string }
              - name: steps
                label: "Déroulé — étapes"
                widget: list
                field: { name: step, label: "Étape", widget: text }
              - { name: image, label: "Photo principale", widget: image }
              - name: gallery
                label: "Galerie photos"
                widget: list
                field: { name: photo, label: "Photo", widget: image }
              - { name: flipped, label: "Inverser image ↔ texte", widget: boolean, default: false }
              - { name: bookingUrl, label: "URL de réservation Wecandoo", widget: string }
          - name: locationSection
            label: "Section « Où ça se passe »"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: "Petit texte au-dessus", widget: string, required: false }
              - { name: titleLine1, label: "Titre — ligne 1", widget: string }
              - { name: titleLine2, label: "Titre — ligne 2 (calligraphie)", widget: string, required: false }
              - { name: intro, label: "Paragraphe (**gras** avec ** **)", widget: text, required: false }
              - { name: address, label: "Adresse complète", widget: string }
              - { name: access, label: "Accès", widget: string, required: false }
              - { name: parking, label: "Parking", widget: string, required: false }
              - { name: mapsUrl, label: "URL Google Maps", widget: string, required: false }
              - { name: video, label: "Vidéo boutique (mp4)", widget: file, required: false }
              - { name: videoPoster, label: "Poster vidéo boutique", widget: image, required: false }
              - { name: videoAlt, label: "Description alt vidéo", widget: string, required: false }
          - name: artisanSection
            label: "Section « Votre hôte »"
            widget: object
            collapsed: true
            fields:
              - { name: kicker, label: "Petit texte au-dessus", widget: string, required: false }
              - { name: name, label: "Prénom (calligraphie)", widget: string }
              - { name: role, label: "Rôle / métier", widget: string }
              - { name: image, label: "Photo de l'artisan", widget: image }
              - { name: imageAlt, label: "Description alt photo", widget: string, required: false }
              - name: bio
                label: "Biographie (1 paragraphe par ligne)"
                widget: list
                field: { name: paragraph, label: "Paragraphe", widget: text }
          - name: groupsSection
            label: "Section « Groupes »"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: kicker, label: "Petit texte au-dessus", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton 1 — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton 1 — lien", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton 2 — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton 2 — lien", widget: string, required: false }
          - name: ctaSection
            label: "Section CTA final"
            widget: object
            collapsed: true
            required: false
            fields:
              - { name: script, label: "Petit texte calligraphié", widget: string, required: false }
              - { name: title, label: "Titre", widget: string }
              - { name: intro, label: "Paragraphe", widget: text, required: false }
              - { name: ctaPrimaryLabel, label: "Bouton 1 — texte", widget: string, required: false }
              - { name: ctaPrimaryHref, label: "Bouton 1 — lien", widget: string, required: false }
              - { name: ctaSecondaryLabel, label: "Bouton 2 — texte", widget: string, required: false }
              - { name: ctaSecondaryHref, label: "Bouton 2 — lien", widget: string, required: false }

      # ═════════════════════════════════════════════════════════════
      # NOTRE HISTOIRE
      # ═════════════════════════════════════════════════════════════
      - name: notre-histoire
        label: "Notre histoire"
        file: src/content/static-pages/notre-histoire.md
        media_folder: /public/images
        public_folder: /images
        preview_path: "notre-histoire"
        fields:
          - name: meta
            label: "SEO"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre (balise <title>)", widget: string }
              - { name: description, label: "Meta description Google", widget: text }
          - name: pageHeader
            label: "Header (kicker / titre / sous-titre)"
            widget: object
            fields:
              - { name: kicker, label: "Kicker", widget: string, required: false }
              - { name: title, label: "Titre (HTML autorisé : <br /><em>...</em>)", widget: string }
              - { name: subtitle, label: "Sous-titre", widget: text, required: false }
          - name: videoHero
            label: "Vidéo hero (bandeau plein largeur)"
